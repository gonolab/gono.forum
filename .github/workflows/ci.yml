# Formatting and Clippy, for pushes to main and pull requests. release.yml calls it too, so a tag is only published
# after the same checks pass on the tagged commit.
# The Rust test suite (SQLite, MySQL 5.7.44 and 8.4) and the browser checks (tests/e2e) are not run here: they run on a
# developer machine before merging and before tagging (CONTRIBUTING.md, "Tests"; docs/releasing.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; pushes to main and release runs each keep their own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-clippy-${{ runner.os }}-

      - run: cargo fmt --all --check

      - run: cargo clippy --locked --all-targets -- -D warnings
