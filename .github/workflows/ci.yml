# Formatting, Clippy and the Rust test suite on SQLite and on MySQL 5.7 and 8.4, for pushes to main and pull
# requests. release.yml calls it too, so a tag is only published after the same checks pass on the tagged commit.
# The browser checks (tests/e2e) are not run here; see CONTRIBUTING.md, "Browser checks".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; pushes to main and release runs each keep their own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-clippy-${{ runner.os }}-

      - run: cargo fmt --all --check

      - run: cargo clippy --locked --all-targets -- -D warnings

  test-sqlite:
    name: tests (SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # No test configuration file: the variables below are all the suite needs (README, "Tests").
      GONOF_TEST_BACKEND: sqlite
      GONOF_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stylesheets and editor script (a few tests load them)
        run: npm ci --ignore-scripts && npm run build

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - run: cargo test --locked -p gono-forum-web --no-fail-fast -- --test-threads=4

  test-mysql:
    name: tests (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # 5.7.44 is the oldest supported version (docs/install.md); 8.4 is the current long-term release.
          # The 5.7 image offers TLS without ECDHE key exchange, which rustls does not accept, so its connection goes
          # without TLS (docs/install.md, "Setup wizard").
          - mysql: "5.7.44"
            threads: 2
            url-options: "?ssl-mode=disabled"
          - mysql: "8.4"
            threads: 4
            url-options: ""
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        # The image's first start runs a temporary server without networking, so a ping over TCP only answers once
        # the real server is up.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GONOF_TEST_MYSQL_URL: mysql://root@127.0.0.1:3306/mysql${{ matrix.url-options }}
      GONOF_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Server character set and collation
        # Each test database is created with utf8mb4_bin; the server defaults are set to match, as on a forum's own
        # server (5.7 would otherwise default to latin1).
        run: >-
          docker exec ${{ job.services.mysql.id }}
          mysql -uroot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_bin';"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stylesheets and editor script (a few tests load them)
        run: npm ci --ignore-scripts && npm run build

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - run: cargo test --locked -p gono-forum-web --no-fail-fast -- --test-threads=${{ matrix.threads }}
