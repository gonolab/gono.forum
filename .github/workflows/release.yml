# Publishes the release packages when a version tag is pushed, once the checks in ci.yml have passed on the tagged
# commit. The same script builds them on a Linux machine by hand: scripts/package-release.sh.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain and musl targets
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Zig and cargo-zigbuild
        run: |
          python3 -m pip install --user ziglang==0.15.2
          cargo install --locked cargo-zigbuild --version 0.20.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"

      - name: cargo-about (license texts of the linked crates)
        run: cargo install --locked cargo-about --version 0.9.3 --features cli

      - name: The tag must match the crate version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/web/Cargo.toml | head -n 1)
          [ "${GITHUB_REF_NAME#v}" = "$crate" ] || { echo "tag $GITHUB_REF_NAME does not match crate version $crate"; exit 1; }

      # The title and text come from the version's section in CHANGELOG.md; without one nothing is built or published.
      - name: Release notes from CHANGELOG.md
        run: |
          scripts/release-notes.sh title "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-title.txt"
          scripts/release-notes.sh notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build packages
        run: scripts/package-release.sh --version "${GITHUB_REF_NAME#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "$(cat "$RUNNER_TEMP/release-title.txt")" --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/"$version"/*.tar.gz dist/"$version"/forum.install.sh dist/"$version"/checksums.txt
