name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help for layout problems.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `gono-forum-web --version`, or the commit for a source build.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - MySQL 5.7
        - MySQL 8.x
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: redis
    attributes:
      label: Redis
      options:
        - "Off"
        - "On"
  - type: input
    id: language
    attributes:
      label: Site language
      placeholder: en
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For problems in pages.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `journalctl -u gono-forum-<instance>` or the terminal. Remove passwords, keys and personal data.
      render: text
