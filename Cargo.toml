[workspace]
members = ["apps/web"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/gonolab/gono.forum"

# Release packages (scripts/package-release.sh): stripped, thin LTO. Local `--release` builds keep the defaults.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
