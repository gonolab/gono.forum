# The built-in default skin: the standard look of Gono Forum, the base color scheme
# (frontend/styles/themes/default.json) with nothing changed and no stylesheet of its own. Every site starts with it,
# and every skin choice that cannot be used falls back to it (docs/skins.md).
contract = 1
id = "default"
version = "1.0.0"
# Built-in skins write only English here: their names and descriptions are translated in the translation files
# (skin-builtin-default-name and -description in locales/<language>/skin.ftl, docs/skins.md, "The manifest").
name = { en = "Default" }
description = { en = "The standard look of Gono Forum." }
author = "Gono Forum"
license = "MIT OR Apache-2.0"

[palettes]
default = "default"

[frame]
nav = "top"
header_boards = true
# Members choose round or rounded avatars themselves.
avatar_shape = "member"
