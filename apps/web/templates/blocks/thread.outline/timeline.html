{#- thread.outline as a timeline (docs/skins.md, "Views"): without a behavior module, the dates as links to their floors. #}
<section class="panel panel--aside block-outline{% if block.keep %} panel--keep{% endif %}{{ block.hooks() }}"{{ block.attribute()|safe }} data-outline-tid="{{ data.tid }}">
  <h2 class="panel__title">{{ block.title }}</h2>
  <ol class="block-outline__marks">
    {%- for mark in data.dates %}
    <li><a href="{{ crate::site::prefixed(mark.href) }}"><time datetime="{{ mark.at.at }}" title="{{ mark.at.title }}">{{ mark.at.text }}</time></a></li>
    {%- endfor %}
  </ol>
</section>
