{#- The built-in board glyphs as symbols (organization/glyphs.rs, docs/skins.md, "Board colors and glyphs"), drawn once on a page that shows them and used as <svg><use href="#board-glyph-<name>"></use></svg>. currentColor on a symbol resolves to the use element's color. -#}
<svg class="board-glyph-sprite" width="0" height="0" aria-hidden="true" focusable="false"><defs>{% for glyph in crate::organization::glyphs::GLYPHS %}<symbol id="board-glyph-{{ glyph.name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{{ glyph.body|safe }}</symbol>{% endfor %}</defs></svg>
