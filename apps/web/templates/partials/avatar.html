{% if avatar.stacked %}<span class="avatar avatar--initials avatar-stack avatar-{{ avatar.variant }}" aria-hidden="true" translate="no">{{ avatar.label }}<img src="{{ crate::site::href(avatar.url) }}" alt="" loading="lazy" decoding="async"></span>{% elif avatar.url.is_empty() %}<span class="avatar avatar--initials avatar-{{ avatar.variant }}" aria-hidden="true" translate="no">{{ avatar.label }}</span>{% else %}<img class="avatar" src="{{ crate::site::href(avatar.url) }}" alt="" loading="lazy" decoding="async">{% endif %}
