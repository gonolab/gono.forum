{% for button in filter.buttons %}<form class="inline-form" method="post" action="{{ crate::site::href(filter.action) }}" hx-post="{{ crate::site::href(filter.action) }}" hx-boost="false" hx-disabled-elt="find button"><input type="hidden" name="_csrf" value="{{ p.csrf }}"><input type="hidden" name="request_key" value="{{ button.request_key }}"><input type="hidden" name="mode" value="{{ button.mode }}"><input type="hidden" name="location" value="{{ filter.location }}"><button type="submit" class="icon-button" data-forum-filter="{{ button.mode }}">{{ button.label }}</button></form>{% endfor %}{% if !filter.note.is_empty() %}<p class="board-head__desc" data-forum-filter-note>{{ filter.note }}</p>{% endif %}
